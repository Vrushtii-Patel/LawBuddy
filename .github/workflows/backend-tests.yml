name: Backend Tests

on:
  push:
    branches:
      - main
      - "deployment/**"
    paths:
      - "server/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Tests use a disposable database and secret; never inject production credentials into CI.
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-secret-not-for-production-123456789
      MONGODB_URI: mongodb://127.0.0.1:27017/lawbuddy_test
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      # Only on the isolated audit branch, test safe updates within existing semver ranges.
      - name: Update vulnerable packages within existing ranges
        if: github.ref == 'refs/heads/deployment/audit-production-db-startup'
        run: npm install nodemailer@^10.0.6 && npm update proxy-addr qs
      - name: Report dependency vulnerabilities without changing the lockfile
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const report = require('/tmp/npm-audit.json');
          console.log('Dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities || {}, null, 2));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via.map(v => typeof v === 'string' ? v : {
                name: v.name,
                title: v.title,
                url: v.url,
                range: v.range
              })
            }));
          }
          NODE
      - name: Check changed startup and OTP files
        run: |
          node --check src/index.js
          node --check src/routes/authRoutes.js
          node --check src/services/scanJobService.js
          node --check src/services/documentCleanupService.js
          node --check src/models/ScanJob.js
          node --check tests/test_production_startup.js
          node --check tests/test_scan_file_storage.js
      - name: Verify production startup fails closed
        run: node tests/test_production_startup.js
      - name: Verify durable scan file storage and recovery safety
        run: node tests/test_scan_file_storage.js
      - name: Run backend regression suite
        run: npm test
      - name: Commit verified dependency lockfile updates on audit branch
        if: github.ref == 'refs/heads/deployment/audit-production-db-startup'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No dependency lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix audited backend dependency vulnerabilities"
          git push origin HEAD:deployment/audit-production-db-startup
