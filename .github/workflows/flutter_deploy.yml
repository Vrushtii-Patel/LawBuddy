name: CI/CD Pipeline & GitHub Pages Deployment

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/flutter_deploy.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/flutter_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ci-and-deploy:
    name: Flutter Web CI & Deploy
    runs-on: ubuntu-latest

    # Permissions required to publish build artifacts to GitHub Pages
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Analyze code
        working-directory: ./client
        run: flutter analyze

      - name: Run client tests
        working-directory: ./client
        run: flutter test

      - name: Require API_URL secret
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::The API_URL repository secret is empty or missing. Refusing to build a release that would point at localhost."
            exit 1
          fi

      - name: Build Web App
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: ./client
        # API_URL is supplied via repository secrets; base-href configured for GitHub Pages repository root
        run: flutter build web --release --dart-define=API_URL=${{ secrets.API_URL }} --base-href="/LawBuddy/"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/build/web