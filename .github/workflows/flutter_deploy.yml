name: CI/CD Pipeline & GitHub Pages Deployment

on:
  push:
    branches:
      - main
      - master
      - Jiya
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI (Node.js & Express)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run backend tests
        working-directory: ./server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/lawbuddy_test
          JWT_SECRET: test_jwt_secret_super_secure_key_1234567890
          ALLOW_DEV_EMAIL_FALLBACK: 'true'
        run: npm test

  flutter-ci-and-deploy:
    name: Flutter Web CI & Deploy
    needs: [backend-ci]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Analyze code
        working-directory: ./client
        run: flutter analyze

      - name: Run client tests
        working-directory: ./client
        run: flutter test

      - name: Validate production API URL
        if: github.event_name != 'pull_request'
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Configure the API_URL repository secret to your deployed HTTPS backend URL ending in /api."
            exit 1
          fi
          case "$API_URL" in
            https://*/api) ;;
            *) echo "::error::API_URL must use HTTPS and end with /api (example: https://your-backend.onrender.com/api)."; exit 1 ;;
          esac

      - name: Build Web App
        working-directory: ./client
        # Pull requests build with a non-routable placeholder; production builds require the secret above.
        env:
          API_URL: ${{ secrets.API_URL || 'https://api.example.invalid/api' }}
        run: flutter build web --release --dart-define="API_URL=${API_URL}" --base-href="/LawBuddy/"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Jiya'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/build/web
